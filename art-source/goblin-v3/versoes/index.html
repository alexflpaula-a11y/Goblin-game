<!doctype html>
<meta charset="utf-8">
<title>Goblin — 10 versoes diferentes</title>
<style>
 body { background:#15170f; color:#e8e4d0; font:15px/1.5 monospace;
        margin:0; padding:24px 16px; }
 h1 { font-size:20px; margin:0 0 4px; }
 p.ajuda { color:#9aa08a; margin:0 0 20px; }
 figure { margin:0 0 26px; }
 figcaption { margin-bottom:6px; }
 img { width:100%; max-width:1280px; image-rendering:pixelated;
        border:1px solid #2c3024; background:#1a1c18; display:block; }

<h1>Goblin — 10 versoes diferentes</h1>
<p class="ajuda">Colunas: parado · andando · batendo · levando pancada.
Todas usam a animacao do goblin original, quadro a quadro.</p>
  <figure>
    <figcaption><b>V01</b> — O original, so dobrado de tamanho (referencia)</figcaption>
    <img src="v01-fiel.gif" alt="v01-fiel">
  </figure>
  <figure>
    <figcaption><b>V02</b> — O original com luz, sombra e pupila</figcaption>
    <img src="v02-detalhado.gif" alt="v02-detalhado">
  </figure>
  <figure>
    <figcaption><b>V03</b> — Cores chapadas e contorno preto grosso</figcaption>
    <img src="v03-desenho.gif" alt="v03-desenho">
  </figure>
  <figure>
    <figcaption><b>V04</b> — Sem contorno nenhum, pele clara</figcaption>
    <img src="v04-macio.gif" alt="v04-macio">
  </figure>
  <figure>
    <figcaption><b>V05</b> — Cabeca 35% maior (proporcao de mascote)</figcaption>
    <img src="v05-cabecudo.gif" alt="v05-cabecudo">
  </figure>
  <figure>
    <figcaption><b>V06</b> — Alto e magro, 18% mais esticado</figcaption>
    <img src="v06-esguio.gif" alt="v06-esguio">
  </figure>
  <figure>
    <figcaption><b>V07</b> — Pele oliva, presas maiores, pintura de guerra</figcaption>
    <img src="v07-selvagem.gif" alt="v07-selvagem">
  </figure>
  <figure>
    <figcaption><b>V08</b> — Pele de pedra cinza, olho amarelo, textura pontilhada</figcaption>
    <img src="v08-caverna.gif" alt="v08-caverna">
  </figure>
  <figure>
    <figcaption><b>V09</b> — Pele roxa, panos de osso, olho ciano</figcaption>
    <img src="v09-xama.gif" alt="v09-xama">
  </figure>
  <figure>
    <figcaption><b>V10</b> — Pano virou placa de metal, contorno grosso</figcaption>
    <img src="v10-encouracado.gif" alt="v10-encouracado">
  </figure>
