name: Deploy GitHub Pages

# Publica o jogo no GitHub Pages sempre que a branch main muda.
# Reconstrói o arquivo único e o serve como index.html (carregamento rápido).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões necessárias para o deploy no Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; um novo cancela o anterior em andamento.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Construir o site
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Rodar os testes antes de publicar
        run: bash tools/test.sh

      - name: (Re)construir o arquivo único
        run: python3 tools/build_singlefile.py

      - name: Montar a pasta publicada (_site)
        run: |
          mkdir -p _site
          # O link principal (raiz) serve a versão rápida de arquivo único.
          cp vila-de-goblins-jogavel.html _site/index.html
          # Mantém também o link direto pelo nome do arquivo.
          cp vila-de-goblins-jogavel.html _site/vila-de-goblins-jogavel.html
          # Evita o processamento Jekyll (arquivos começando com _ etc.).
          touch _site/.nojekyll

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar o artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
