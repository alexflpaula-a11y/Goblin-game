<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Conjunto Avaritia — preview</title>
<style>
:root{--bg:#0d0f14;--panel:#171a21;--border:#2a2e38;--txt:#ebeef5;--sub:#8c94a5;--teal:#63def1}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,sans-serif;padding:24px}
h1{font-size:26px;letter-spacing:.5px} h1 span{color:var(--teal)}
.sub{color:var(--sub);margin:4px 0 18px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:stretch}
.panel{background:var(--panel);border:2px solid var(--border);border-radius:10px;padding:14px}
label.chk{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--border);
 border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600;user-select:none}
label.chk img{image-rendering:pixelated;width:32px;height:32px}
label.chk input{width:18px;height:18px;accent-color:#63def1}
.anim{width:230px}
.anim h3{font-size:13px;color:var(--teal);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.anim .palco{background:
 repeating-conic-gradient(#1e2129 0% 25%,#14161c 0% 50%) 0 0/16px 16px;
 border:2px solid var(--border);border-radius:8px;display:flex;justify-content:center;padding:12px}
.anim img{image-rendering:pixelated;width:192px;height:192px}
.drops{display:flex;gap:14px;margin-top:18px}
.drop{width:300px;text-align:center}
.drop .glow{position:relative;height:110px;display:flex;align-items:center;justify-content:center}
.drop .glow::before{content:"";position:absolute;width:92px;height:92px;border-radius:50%;
 background:radial-gradient(circle,rgba(99,222,241,.5),rgba(99,222,241,0) 70%);animation:pulse 1.2s ease-in-out infinite}
.drop .glow img{image-rendering:pixelated;width:64px;height:64px;animation:floaty 1.2s ease-in-out infinite;position:relative}
.drop h4{margin:6px 0 2px}.drop .slot{color:var(--teal);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.drop p{color:var(--sub);font-size:12.5px;margin-top:6px}
.inv{margin-top:18px;width:100%}
.inv .grid{display:flex;gap:12px}
.slotinv{background:repeating-conic-gradient(#1e2129 0% 25%,#14161c 0% 50%) 0 0/12px 12px;
 border:2px solid var(--border);border-radius:8px;padding:10px;text-align:center;width:180px}
.slotinv img{image-rendering:pixelated;width:64px;height:64px}
.slotinv h4{font-size:13px}.slotinv div{color:var(--sub);font-size:11.5px}
@keyframes floaty{0%,100%{transform:translateY(-7px)}50%{transform:translateY(7px)}}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.12);opacity:1}}
#status{font-size:12.5px;color:var(--sub);margin-left:10px}
</style></head><body>

const MS = {"idle": 220, "walk": 110, "attack": 90, "hurt": 150, "death": 160};
const COUNTS = {"idle": 5, "walk": 8, "attack": 17, "hurt": 17, "death": 15};
const KEY = p => [p.cap&&'capacete',p.pei&&'peitoral',p.cal&&'calca'].filter(Boolean).join('+')||'base';
let sel = {pei:true, cal:true, cap:true};
const chk = (id, key, label, icon) =>
 `<label class="chk" style="${sel[key]?'border-color:#63def1':''}">
  <input type="checkbox" id="${id}" ${sel[key]?'checked':''} onchange="sel['${key}']=this.checked;renderChecks();play()">
  <img src="data:image/png;base64,${icon}"> ${label}</label>`;
function renderChecks(){
  document.getElementById('checks').innerHTML =
    chk('c1','pei','Peitoral',DROPS[0].icon) +
    chk('c2','cal','Calça',DROPS[1].icon) +
    chk('c3','cap','Capacete',DROPS[2].icon);
  document.querySelectorAll('.chk input').forEach((el)=>{
    el.parentElement.style.borderColor = el.checked ? '#63def1' : 'var(--border)';
  });
  document.getElementById('status').textContent =
    'exibindo: ' + (KEY(sel)==='conjunto_avaritia'?'conjunto completo (blackout total)':KEY(sel).replace('+',' + '));
}
const anims = [['idle','idle'],['walk','walk'],['attack','attack'],['hurt','hurt'],['death','death']];
document.getElementById('anims').innerHTML = anims.map(([a,lab])=>
 `<div class="panel anim"><h3>${lab}</h3><div class="palco">
  <img id="img_${a}" data-a="${a}"></div></div>`).join('');
let timers = {};
function play(){
  const src = KEY(sel)==='capacete+peitoral+calca' ? 'conjunto_avaritia' : KEY(sel);
  const data = DATA[src];
  Object.values(timers).forEach(clearInterval);
  for (const a of Object.keys(COUNTS)){
    const img = document.getElementById('img_'+a);
    let i = 0;
    img.src = 'data:image/png;base64,'+data[a][0];
    timers[a] = setInterval(()=>{ i=(i+1)%COUNTS[a];
      img.src='data:image/png;base64,'+data[a][i]; }, MS[a]);
  }
}
document.getElementById('drops').innerHTML = DROPS.map(d=>
 `<div class="panel drop"><div class="glow"><img src="data:image/png;base64,${d.drop}"></div>
  <h4>${d.nome}</h4><div class="slot">slot: ${d.slot} · tier ${d.tier}</div>
  <p>${d.desc}</p></div>`).join('');
document.getElementById('inv').innerHTML = DROPS.map(d=>
 `<div class="slotinv"><img src="data:image/png;base64,${d.icon}">
  <h4>${d.nome}</h4><div>slot ${d.slot} · uncommon · tier ${d.tier}</div></div>`).join('');
renderChecks(); play();
